<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Cube Roll — DEV PREVIEW</title>
  <style>
    :root {
      --eng-bg: #0a0b0d;
      --eng-panel: #16181c;
      --eng-panel-2: #1d2024;
      --eng-panel-3: #24272c;
      --eng-border: #2c2f35;
      --eng-border-soft: rgba(255, 255, 255, 0.07);
      --eng-accent: #e8961e;
      --eng-accent-soft: rgba(232, 150, 30, 0.16);
      --eng-accent-hover: #ffab3d;
      --eng-danger: #ff5252;
      --eng-danger-soft: rgba(255, 82, 82, 0.14);
      --eng-ok: #4ade80;
      --eng-warn: #ffcc4d;
      --eng-audio: #b98cf7;
      --eng-audio-soft: rgba(185, 140, 247, 0.16);
      --eng-audio-hover: #cba9fa;
      --eng-text: #e8e9eb;
      --eng-text-dim: #9aa0a8;
      --eng-text-faint: #676c74;
      --eng-mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
      --eng-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --eng-radius: 8px;
      --eng-radius-sm: 5px;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: var(--eng-sans);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Fills the real browser window. #device-frame is positioned inside
       via explicit JS-computed left/top (see applyDeviceFrame) rather than
       flex-centering, because the target area to center *within* isn't
       always the full window — while the editor's open, its panels take
       up real space (see EDITOR_INSETS), and the frame centers in
       whatever's left so the simulated screen is never hidden behind them.
       Background shows as the letterbox bars whenever the frame doesn't
       fill the whole available area. */
    #frame-stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px) 0 0 / 28px 28px,
        var(--eng-bg);
    }

    /* The actual "device screen" — full window (or full available area,
       see above) in Real mode, a letterboxed 16:9/9:16 box otherwise.
       Sized/positioned via JS; everything game-related lives inside it and
       is positioned relative to *this*, not the real window, so it's
       correct in every mode without any special-casing. */
    #device-frame {
      /* border-box, scoped to just this element (not a global reset) —
         the border must render *inside* the JS-computed width/height, or
         it pushes the frame a few px past the stage it was just fit to
         avoid (e.g. into the editor's side panels). */
      box-sizing: border-box;
      position: absolute;
      overflow: hidden;
      background: #8ed1ef;
      border: 1px solid rgba(232, 150, 30, 0.5);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), 0 0 24px rgba(232, 150, 30, 0.12), 0 20px 60px rgba(0, 0, 0, 0.55);
      transition: left 0.15s ease, top 0.15s ease, width 0.15s ease, height 0.15s ease;
    }

    #game {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Everything on top of the 3D scene — HUD, joystick, end card — is
       placed and styled entirely in tools/ui-editor.html and shipped as
       src/ui/mainLayout.json + src/ui/endcardLayout.json, rendered here by
       UILayout.ts. There is no hardcoded game UI in this file. */
    #custom-ui-layer {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    #endcard-layer {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    /* ===================================================================
       Shared "engine panel" chrome — used by Engine Room, Hierarchy,
       Inspector. A header strip (icon + uppercase label) over a body.
       =================================================================== */
    .eng-panel {
      background: linear-gradient(180deg, var(--eng-panel-2), var(--eng-panel));
      border: 1px solid var(--eng-border);
      border-radius: var(--eng-radius);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      pointer-events: auto;
    }

    .eng-panel-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--eng-text-dim);
      border-bottom: 1px solid var(--eng-border-soft);
      background: rgba(255, 255, 255, 0.015);
    }

    .eng-panel-header .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--eng-ok);
      box-shadow: 0 0 5px var(--eng-ok);
      flex-shrink: 0;
    }

    .eng-panel-header .tag {
      margin-left: auto;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--eng-accent);
      background: var(--eng-accent-soft);
      border: 1px solid rgba(232, 150, 30, 0.3);
      border-radius: 999px;
      padding: 1.5px 7px;
    }

    /* ---- Engine Room: dev-only control panel. Editor/Build live here
       (Build button doesn't exist without scripts/dev-build-api.js running
       alongside the dev server — see scripts/dev.js); stats + the view
       helper gizmo are fed live by Game.ts/main.ts (see the bottom
       script). Nothing here exists in the production build.
       A full-height dock flush against the right edge (not a floating
       card) — ENGINE_ROOM_WIDTH below in the script keeps the device-frame
       simulator's math in sync so the game view is always inset out from
       under it, never covered by it. */
    #engine-room {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 70;
      width: 280px;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, var(--eng-panel-2), var(--eng-panel) 45%, var(--eng-panel-2));
      border-left: 1px solid var(--eng-border);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(0, 0, 0, 0.3);
      font-size: 11px;
      color: var(--eng-text);
      overflow-y: auto;
      pointer-events: auto;
    }

    #engine-room-header {
      flex-shrink: 0;
    }

    #engine-room-header .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--eng-ok);
      box-shadow: 0 0 5px var(--eng-ok);
      flex-shrink: 0;
      animation: eng-pulse 1.6s ease-in-out infinite;
    }

    @keyframes eng-pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    #engine-room-body {
      padding: 14px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    #engine-room-footer {
      flex-shrink: 0;
      margin-top: auto;
      padding-top: 12px;
      text-align: center;
    }

    #engine-room-footer .brand {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--eng-text-faint);
    }

    /* Live version + short commit hash of the local HEAD, fetched from
       scripts/dev-build-api.js's GET /version (same 127.0.0.1:8001 API the
       Build button uses) — so it always reflects whatever's actually
       checked out, not a hand-maintained number that drifts. */
    #engine-room-version {
      margin-top: 3px;
      font-family: var(--eng-mono);
      font-size: 10px;
      color: var(--eng-text-dim);
      cursor: default;
    }

    #engine-room-version .dirty {
      color: var(--eng-warn);
    }

    #engine-room-actions {
      display: flex;
      gap: 5px;
      margin-bottom: 8px;
    }

    #engine-room-actions button {
      flex: 1;
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--eng-text);
      background: var(--eng-panel-3);
      border: 1px solid var(--eng-border);
      padding: 7px 4px;
      border-radius: var(--eng-radius-sm);
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, transform 0.06s ease;
    }

    #engine-room-actions button:hover:not(:disabled) {
      background: #2c3036;
      border-color: #3a3e45;
    }

    #engine-room-actions button:active:not(:disabled) {
      transform: scale(0.96);
    }

    #engine-room-actions button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #engine-room-actions button.primary {
      background: var(--eng-accent);
      border-color: var(--eng-accent);
      color: #1a1204;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.25) inset;
    }

    #engine-room-actions button.primary:hover:not(:disabled) {
      background: var(--eng-accent-hover);
    }

    #er-btn-viewer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 700;
      color: #062230;
      background: #7cd6f7;
      border: 1px solid #7cd6f7;
      padding: 7px 4px;
      border-radius: var(--eng-radius-sm);
      cursor: pointer;
      margin-bottom: 9px;
      transition: background 0.12s ease;
    }

    #er-btn-viewer:hover {
      background: #9de3fa;
    }

    /* Audio Reactor — violet, deliberately a third distinct hue alongside
       the amber primary actions and the cyan 3D View button, so all three
       read as separate "modes" at a glance instead of blurring together.
       Same button treatment as #er-btn-viewer, just re-tinted. */
    #er-btn-audio {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 700;
      color: #1f1033;
      background: var(--eng-audio);
      border: 1px solid var(--eng-audio);
      padding: 7px 4px;
      border-radius: var(--eng-radius-sm);
      cursor: pointer;
      margin-bottom: 9px;
      transition: background 0.12s ease;
    }

    #er-btn-audio:hover {
      background: var(--eng-audio-hover);
    }

    /* Audio Reactor panel — dev-only, empty placeholder for now. Same
       "eng-panel" chrome as the Engine Room dock but a free-floating panel
       (bottom-left) rather than docked, since it isn't tied to freecam like
       #si-hierarchy/#si-inspector are — it can open regardless of 3D View
       state. Toggled purely by #er-btn-audio (see script section). */
    #audio-reactor {
      display: none;
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 70;
      width: 250px;
    }

    #audio-reactor.visible {
      display: block;
    }

    #audio-reactor .eng-panel-header .dot {
      background: var(--eng-audio);
      box-shadow: 0 0 5px var(--eng-audio);
    }

    #audio-reactor .eng-panel-header .tag {
      color: var(--eng-audio);
      background: var(--eng-audio-soft);
      border-color: rgba(185, 140, 247, 0.3);
    }

    #audio-reactor-body {
      padding: 16px 14px;
      font-size: 11px;
      font-style: italic;
      color: var(--eng-text-faint);
      text-align: center;
    }

    /* Exit (3D Viewer/Editor): the only thing shown top-right while
       freecam is active (#engine-room itself hides — see script section).
       Deliberately a different look from the rest of the dev chrome so it
       reads as "you are in a special mode," not just another panel
       button. Stays in this exact spot regardless of anything else this
       mode changes (device-topbar hiding, panel contents, ...) — it's the
       one fixed anchor you can always find to get back out. */
    #er-exit-3d {
      display: flex;
      position: fixed;
      top: 54px;
      right: 10px;
      z-index: 71;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      color: #ffe066;
      background: linear-gradient(180deg, #142c78, #0b1f5c);
      border: 1px solid #ffe066;
      border-radius: var(--eng-radius);
      padding: 9px 15px;
      cursor: pointer;
      pointer-events: none;
      visibility: hidden;
      opacity: 0;
      /* Scales in rather than sliding — it's the one control here treated
         as "you just entered a special mode" (see the comment above), so
         it announces itself differently from the panels that just dock
         into place. */
      transform: scale(0.9);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5), 0 0 18px rgba(255, 224, 102, 0.15);
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s linear 0.2s;
    }

    #er-exit-3d.visible {
      pointer-events: auto;
      visibility: visible;
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #er-exit-3d:hover {
      background: linear-gradient(180deg, #1a3690, #0e256e);
    }

    #er-exit-3d::before {
      content: "\25C9";
      color: #ffe066;
      font-size: 10px;
      animation: eng-pulse 1.4s ease-in-out infinite;
    }

    /* Builder — a centered modal the 🛠 Builder button opens (without
       building anything yet — see the script section's refreshEstimate).
       It shows dist/index.html's size as of the *last* real build against
       the ~5MB budget most ad networks enforce for a single-file upload,
       flagged fresh/stale by the badge above the bar; the 🚀 Build Now
       button inside actually runs build.sh and swaps in the real,
       just-measured number. Room to grow: this is one labeled section
       (.builder-section) plus an Actions section with one button today —
       a second option (asset breakdown, a target-network preset, ...)
       is another .builder-section, not a redesign. */
    #builder-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.55);
      align-items: center;
      justify-content: center;
    }

    #builder-modal-backdrop.visible {
      display: flex;
    }

    #builder-modal {
      width: 380px;
      background: linear-gradient(180deg, var(--eng-panel-2), var(--eng-panel));
      border: 1px solid var(--eng-border);
      border-radius: var(--eng-radius);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    #builder-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      font-family: var(--eng-mono);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--eng-text-dim);
      border-bottom: 1px solid var(--eng-border-soft);
      background: rgba(255, 255, 255, 0.02);
    }

    #builder-modal-close {
      background: none;
      border: none;
      color: var(--eng-text-faint);
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 3px 5px;
      border-radius: 4px;
    }

    #builder-modal-close:hover {
      color: var(--eng-text);
      background: rgba(255, 255, 255, 0.08);
    }

    #builder-modal-body {
      padding: 18px 18px 20px;
    }

    /* A labeled group within the panel — the estimate readout is one, the
       Build action is another; laid out so a third (asset breakdown,
       target-network presets, whatever's next) drops in the same way
       without restructuring anything around it. */
    .builder-section {
      margin-bottom: 16px;
    }

    .builder-section-label {
      font-family: var(--eng-mono);
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--eng-text-faint);
      margin-bottom: 9px;
    }

    /* Freshness badge — tells you *before* you build whether the number
       below is a live measurement or last build's, since this panel now
       shows a size before you've actually clicked Build (see
       openBuilderModal/refreshEstimate in the script below). */
    #builder-freshness {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--eng-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 3px 8px 3px 7px;
      border-radius: 999px;
      background: var(--eng-panel-3);
      border: 1px solid var(--eng-border);
      color: var(--eng-text-dim);
      margin-bottom: 12px;
    }

    #builder-freshness .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--eng-text-faint);
      flex-shrink: 0;
    }

    #builder-freshness.fresh {
      color: var(--eng-ok);
      border-color: rgba(74, 222, 128, 0.35);
      background: rgba(74, 222, 128, 0.08);
    }
    #builder-freshness.fresh .dot {
      background: var(--eng-ok);
      box-shadow: 0 0 6px 1px rgba(74, 222, 128, 0.8);
    }

    #builder-freshness.stale {
      color: var(--eng-warn);
      border-color: rgba(255, 204, 77, 0.35);
      background: rgba(255, 204, 77, 0.08);
    }
    #builder-freshness.stale .dot {
      background: var(--eng-warn);
      box-shadow: 0 0 6px 1px rgba(255, 204, 77, 0.8);
    }

    #builder-status {
      font-size: 12.5px;
      color: var(--eng-text-dim);
      margin-bottom: 14px;
      text-align: center;
    }

    #builder-bar-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: var(--eng-panel-2);
      border: 1px solid var(--eng-border);
      overflow: hidden;
    }

    #builder-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2fbf5f, #4ade80);
      box-shadow: 0 0 10px 1px rgba(74, 222, 128, 0.65), 0 0 3px rgba(74, 222, 128, 0.9);
      transition: width 1.1s cubic-bezier(0.22, 0.9, 0.32, 1), background 0.3s ease, box-shadow 0.3s ease;
    }

    #builder-bar-fill.over-budget {
      background: linear-gradient(90deg, #dc4545, #ff5252);
      box-shadow: 0 0 10px 1px rgba(255, 82, 82, 0.65), 0 0 3px rgba(255, 82, 82, 0.9);
    }

    #builder-bar-fill.estimate {
      /* Pre-build (last-known or never-built) reading — a duller,
         un-glowing fill so the *real*, post-build glow-up in
         over-budget/normal above reads as a distinct, earned state
         change, not just a color swap. */
      background: repeating-linear-gradient(135deg, #4a4f58 0 8px, #565c66 8px 16px);
      box-shadow: none;
    }

    #builder-size-label {
      margin-top: 11px;
      text-align: center;
      font-family: var(--eng-mono);
      font-size: 13.5px;
      font-weight: 700;
      color: var(--eng-text);
      font-variant-numeric: tabular-nums;
    }

    #builder-size-label .dim {
      color: var(--eng-text-faint);
      font-weight: 600;
    }

    #builder-detail {
      margin-top: 9px;
      text-align: center;
      font-size: 11.5px;
      color: var(--eng-text-dim);
      min-height: 14px;
    }

    /* The Build button — deliberately the loudest thing in this panel
       (everything else here is calm, mono-font, low-saturation Engine
       Room chrome on purpose; this is the one control that actually
       ships bytes, so it earns being the one that doesn't sit quietly).
       An animated aurora sweep through the panel's own accent/ok/audio
       hues (never a color outside that existing palette, just all of
       them moving at once) plus a slow idle breathing glow — settles
       down (see .building/.done/.failed below) the instant it's
       actually doing something, so the flourish reads as "ready, and a
       little excited about it," not as noise fighting the result. */
    #builder-build-btn {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 13px 16px;
      margin-top: 2px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: var(--eng-sans);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #0a0b0d;
      background: linear-gradient(120deg, var(--eng-ok), var(--eng-audio), var(--eng-accent), var(--eng-ok));
      background-size: 300% 100%;
      animation: builder-aurora 5s linear infinite;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18) inset, 0 6px 20px -4px rgba(185, 140, 247, 0.55), 0 6px 20px -4px rgba(74, 222, 128, 0.35);
      transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.2s ease;
    }

    #builder-build-btn .icon {
      font-size: 16px;
      display: inline-block;
      transform-origin: 60% 60%;
    }

    #builder-build-btn:hover:not(:disabled) {
      transform: translateY(-1px) scale(1.015);
      filter: brightness(1.08);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.28) inset, 0 10px 26px -4px rgba(185, 140, 247, 0.7), 0 10px 26px -4px rgba(74, 222, 128, 0.5);
    }

    #builder-build-btn:hover:not(:disabled) .icon {
      animation: builder-icon-wobble 0.5s ease-in-out infinite;
    }

    #builder-build-btn:active:not(:disabled) {
      transform: translateY(0) scale(0.985);
    }

    #builder-build-btn:disabled {
      cursor: default;
    }

    /* Mid-build: the aurora sweep speeds into a tight, focused spin
       instead of a leisurely drift — reads as "working," not "idle." */
    #builder-build-btn.building {
      animation: builder-aurora 1.1s linear infinite;
      color: var(--eng-text);
    }

    #builder-build-btn.building .icon {
      animation: builder-icon-spin 0.9s linear infinite;
    }

    #builder-build-btn.done {
      animation: none;
      background: linear-gradient(120deg, #2fbf5f, var(--eng-ok));
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18) inset, 0 0 24px -2px rgba(74, 222, 128, 0.6);
    }

    #builder-build-btn.failed {
      animation: none;
      background: linear-gradient(120deg, #dc4545, var(--eng-danger));
      color: #fff;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.18) inset, 0 0 24px -2px rgba(255, 82, 82, 0.6);
    }

    @keyframes builder-aurora {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    @keyframes builder-icon-wobble {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      50% { transform: rotate(-14deg) translateY(-1px); }
    }

    @keyframes builder-icon-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      #builder-build-btn,
      #builder-build-btn.building,
      #builder-build-btn .icon,
      #builder-build-btn:hover:not(:disabled) .icon,
      #builder-build-btn.building .icon,
      #si-hierarchy,
      #si-inspector,
      #si-hierarchy.visible,
      #si-inspector.visible,
      #si-gizmo-toolbar,
      #si-gizmo-toolbar.visible,
      #er-exit-3d,
      #er-exit-3d.visible {
        animation: none;
        transition: opacity 0.001s linear, visibility 0s linear;
      }
    }

    /* Scene hierarchy + inspector: dev-only, only meaningful while freecam
       is active (see script section) — same visual language as the Engine
       Room panel, just repositioned so they don't collide with it (which
       is hidden anyway while these show). SceneInspector.ts writes directly
       into these elements' innerHTML, so any static header lives in CSS
       (::before), not real DOM, or it would be wiped on every rebuild.
       Entrance is opacity+slide, not a hard display swap — visibility
       (not display) is what actually removes them from hit-testing while
       hidden, so the transition has something to animate instead of
       snapping instantly. Each panel slides in from whichever screen edge
       it's docked to (hierarchy from the left, inspector from the right),
       so the motion reads as "sliding into its own dock," not a generic
       fade every floating panel in this app would use. */
    #si-hierarchy,
    #si-inspector {
      position: fixed;
      z-index: 70;
      background: linear-gradient(180deg, var(--eng-panel-2), var(--eng-panel));
      border: 1px solid var(--eng-border);
      border-radius: var(--eng-radius);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      font-size: 11px;
      color: var(--eng-text);
      pointer-events: none;
      visibility: hidden;
      opacity: 0;
      backdrop-filter: blur(8px);
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s linear 0.2s;
    }

    #si-hierarchy {
      transform: translateX(-14px);
    }

    #si-inspector {
      transform: translateX(14px);
    }

    #si-hierarchy.visible,
    #si-inspector.visible {
      pointer-events: auto;
      visibility: visible;
      opacity: 1;
      transform: translateX(0);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #si-hierarchy::before,
    #si-inspector::before {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--eng-text-dim);
      border-bottom: 1px solid var(--eng-border-soft);
      background: rgba(255, 255, 255, 0.015);
      border-radius: var(--eng-radius) var(--eng-radius) 0 0;
      margin: -1px -1px 6px -1px;
    }

    /* Live object count, no JS involved — a pure CSS counter, incremented
       once per .si-row SceneInspector.ts renders anywhere inside this
       panel (nested rows included, `counter-increment` doesn't care about
       DOM depth) and reset back to 0 on this panel itself, so it stays in
       sync automatically every time renderHierarchy() rebuilds the rows,
       without SceneInspector needing to know this badge exists at all.
       Rendered via ::after, not ::before — a counter's value at any point
       reflects every counter-increment that precedes it in tree order,
       and ::before is generated *before* the real .si-row children it
       would be counting (so it'd always read back the reset value, 0);
       ::after comes after all of them, so by the time its content is
       evaluated every row has already been counted. Position:absolute
       (against #si-hierarchy's own position:fixed, its nearest positioned
       ancestor) pulls it back up into the header corner despite being
       last in the actual DOM/tree order — paint position and counter
       order are independent, only the latter cares about tree order. */
    #si-hierarchy {
      counter-reset: si-row-count;
    }

    #si-hierarchy::after {
      content: counter(si-row-count);
      position: absolute;
      top: 8px;
      right: 10px;
      font-family: var(--eng-mono);
      font-size: 9.5px;
      font-weight: 800;
      color: var(--eng-text-faint);
      font-variant-numeric: tabular-nums;
    }

    #si-hierarchy::before {
      content: "\1F5C2  Hierarchy";
    }

    #si-inspector::before {
      content: "\1F50E  Inspector";
    }

    /* 54px = the docked #device-topbar's 44px height + a 10px margin —
       kept below in the script as TOP_BAR_HEIGHT; update both together. */
    #si-hierarchy {
      top: 54px;
      left: 10px;
      width: 216px;
      max-height: calc(78vh - 44px);
      overflow-y: auto;
      padding-bottom: 6px;
    }

    .si-row {
      counter-increment: si-row-count;
      margin: 0 6px 1px;
      padding: 4px 7px;
      border-radius: var(--eng-radius-sm);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-left: 2px solid transparent;
      transition: background 0.1s ease;
    }

    .si-row:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .si-row.selected {
      background: var(--eng-accent-soft);
      border-left-color: var(--eng-accent);
      color: #ffd8a3;
      font-weight: 700;
    }

    /* Below #er-exit-3d (also top-right, ~54px tall itself), not level
       with it — they'd otherwise land in the same spot and stack on top
       of each other. */
    #si-inspector {
      top: 100px;
      right: 10px;
      width: 222px;
      max-height: calc(100vh - 116px);
      overflow-y: auto;
      padding: 0 10px 10px;
    }

    .si-insp-empty {
      color: var(--eng-text-faint);
      font-style: italic;
      padding: 4px 0 2px;
    }

    .si-insp-row {
      display: flex;
      justify-content: space-between;
      padding: 2.5px 0;
      font-family: var(--eng-mono);
      font-size: 10.5px;
    }

    .si-insp-row span {
      color: var(--eng-text-faint);
      font-family: var(--eng-sans);
      font-size: 11px;
    }

    .si-insp-row b {
      font-variant-numeric: tabular-nums;
      color: var(--eng-text);
    }

    .si-insp-sub {
      margin-top: 9px;
      padding-top: 6px;
      border-top: 1px solid var(--eng-border-soft);
      font-weight: 800;
      font-size: 9.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--eng-accent);
    }

    /* Visible toggle — a real checkbox now (SceneInspector's inspector
       fields became editable, not just readouts; see its buildInspectorFields). */
    .si-insp-visible-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 0 2px;
      cursor: pointer;
      font-size: 11px;
      color: var(--eng-text-dim);
    }

    .si-insp-visible-row input {
      accent-color: var(--eng-accent);
      cursor: pointer;
    }

    /* Position/Rotation/Scale — three axis fields per row, each a small
       colored X/Y/Z tag (matching the Engine Room view-helper gizmo's own
       red/green/blue axis convention) next to a real number input. Typing
       in one edits the live 3D object directly (see SceneInspector's
       buildAxisRow) — dragging the gizmo in the viewport updates these
       right back, both directions kept in sync every frame. */
    .si-insp-axisgrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-top: 5px;
    }

    .si-insp-axisfield {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid var(--eng-border-soft);
      border-radius: var(--eng-radius-sm);
      overflow: hidden;
    }

    .si-insp-axisfield span {
      flex-shrink: 0;
      width: 16px;
      text-align: center;
      font-size: 9.5px;
      font-weight: 800;
      padding: 5px 0;
      color: #fff;
    }

    .si-insp-axisfield.axis-x span {
      background: rgba(255, 82, 82, 0.6);
    }

    .si-insp-axisfield.axis-y span {
      background: rgba(122, 224, 120, 0.55);
    }

    .si-insp-axisfield.axis-z span {
      background: rgba(90, 170, 255, 0.6);
    }

    .si-insp-axisfield input {
      width: 100%;
      min-width: 0;
      background: transparent;
      border: none;
      color: var(--eng-text);
      font-family: var(--eng-mono);
      font-size: 10.5px;
      padding: 5px 5px;
      -moz-appearance: textfield;
    }

    .si-insp-axisfield input:focus {
      outline: none;
      background: rgba(232, 150, 30, 0.1);
    }

    .si-insp-axisfield input::-webkit-outer-spin-button,
    .si-insp-axisfield input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* Select / Move / Rotate / Scale — the gizmo-mode toolbar, bottom-center
       (the one part of the freecam viewport otherwise left empty), same
       visual family as #device-topbar's buttons. W/E/R/Q do the same thing
       from the keyboard (see SceneInspector.onKeyDown) — clicking here just
       keeps the mode discoverable/mouse-reachable too, and stays in sync
       with the keyboard shortcuts via __onGizmoModeChanged. */
    #si-gizmo-toolbar {
      display: flex;
      position: fixed;
      bottom: 16px;
      left: 50%;
      z-index: 70;
      gap: 2px;
      padding: 4px;
      background: linear-gradient(180deg, var(--eng-panel-2), var(--eng-panel));
      border: 1px solid var(--eng-border);
      border-radius: var(--eng-radius);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      visibility: hidden;
      opacity: 0;
      /* Slides up from just below its own resting spot — the other panels
         each animate in from the screen edge they're docked to; this one
         has no edge of its own (bottom-center), so "rising into place"
         reads the same way. */
      transform: translate(-50%, 10px);
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s linear 0.2s;
    }

    #si-gizmo-toolbar.visible {
      pointer-events: auto;
      visibility: visible;
      opacity: 1;
      transform: translate(-50%, 0);
      transition: opacity 0.2s ease 0.05s, transform 0.2s ease 0.05s;
    }

    #si-gizmo-toolbar button {
      font-family: inherit;
      font-size: 15px;
      color: var(--eng-text-dim);
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--eng-radius-sm);
      width: 34px;
      height: 30px;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    }

    #si-gizmo-toolbar button:hover:not(.active) {
      color: var(--eng-text);
      background: rgba(255, 255, 255, 0.07);
    }

    #si-gizmo-toolbar button.active {
      background: linear-gradient(180deg, var(--eng-accent-hover), var(--eng-accent));
      border-color: var(--eng-accent-hover);
      color: #1a1204;
      box-shadow: 0 0 0 1px rgba(232, 150, 30, 0.35), 0 2px 10px rgba(232, 150, 30, 0.4);
    }

    /* Divider between the Select/Move/Rotate/Scale mode buttons and the
       Grid/Helpers/Snap/Space/Frame toggles — same row, but the second
       group isn't a mutually-exclusive mode like the first, so it reads
       better as a visually separate cluster rather than one undifferentiated
       row of eight buttons. */
    .si-toolbar-sep {
      width: 1px;
      align-self: stretch;
      margin: 3px 3px;
      background: var(--eng-border);
    }

    /* Wraps just the Select/Move/Rotate/Scale buttons — kept as a distinct
       flex group (not flattened into #si-gizmo-toolbar's own children) so
       the mode-select click handler below can query ".si-gizmo-modes
       button" instead of "#si-gizmo-toolbar button": querying the parent
       would also sweep up the Grid/Helpers/Snap/Space/Frame buttons added
       alongside it, each missing the data-gizmo attribute that handler
       reads — calling __setGizmoMode(undefined) crashes TransformControls'
       gizmo on the next render (it indexes an internal lookup table by
       mode name). */
    .si-gizmo-modes {
      display: flex;
      gap: 2px;
    }

    #engine-room-stats {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 8px;
      color: var(--eng-text-dim);
      font-variant-numeric: tabular-nums;
      border-top: 1px solid var(--eng-border-soft);
      padding-top: 8px;
    }

    #engine-room-stats span.val {
      font-family: var(--eng-mono);
      color: var(--eng-text);
      font-weight: 700;
      text-align: right;
    }

    #engine-room-stats span.val.warn {
      color: var(--eng-warn);
    }

    #engine-room-stats span.val.bad {
      color: var(--eng-danger);
    }

    #engine-room-viewhelper-wrap {
      display: flex;
      justify-content: center;
      margin-top: 8px;
      border-top: 1px solid var(--eng-border-soft);
      padding-top: 8px;
    }

    #er-viewhelper-frame {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, rgba(232, 150, 30, 0.1), transparent 70%);
      border: 1px solid var(--eng-border-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #er-viewhelper {
      width: 60px;
      height: 60px;
    }

    /* Engine Room: Control Desk — a live public-field viewer/editor for the
       running game's own gameplay classes (Player, CoinField, World, Game
       itself; never src/game/ui/ or src/engine/ — see /list-logic-scripts
       in scripts/dev-build-api.js). Values come straight from the live
       instance via window.__getInspectable (see IonEngine.ts) — no
       serialization, same document, so edits write straight back onto the
       running object.
       This wrapper itself never scrolls — it's a fixed-height flex column
       (fills whatever's left of the dock below the stats/viewhelper) whose
       two content children (#er-scripts-list, #er-controldesk-body) each
       scroll independently instead, so their own section titles (and the
       Debug/Save buttons riding along with Control Desk's) stay put while
       only the list underneath moves. */
    #engine-room-scripts {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--eng-border-soft);
      overflow: hidden;
    }

    .er-section-title {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--eng-text-dim);
      margin: 0 0 6px;
    }

    .er-section-title .count {
      margin-left: auto;
      color: var(--eng-text-faint);
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
    }

    .er-cd-actions {
      margin-left: auto;
      display: flex;
      gap: 4px;
    }

    .er-cd-actions button {
      font-family: inherit;
      font-size: 9px;
      font-weight: 700;
      text-transform: none;
      letter-spacing: 0;
      color: var(--eng-text-dim);
      background: var(--eng-panel-2);
      border: 1px solid var(--eng-border);
      border-radius: var(--eng-radius-sm);
      padding: 3px 6px;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }

    .er-cd-actions button:hover:not(:disabled) {
      color: var(--eng-text);
      border-color: #3a3e45;
    }

    .er-cd-actions button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #er-cd-debug.active {
      color: var(--eng-danger);
      border-color: var(--eng-danger);
      background: var(--eng-danger-soft);
    }

    #er-cd-save.dirty {
      color: #1a1204;
      background: var(--eng-accent);
      border-color: var(--eng-accent);
    }

    /* Private/protected fields only ever appear with Debug active — shown
       for visibility, dimmed to signal they're read-only (Control Desk
       only ever lets you edit public number/boolean fields). */
    .er-cd-field.private {
      opacity: 0.7;
    }

    .er-cd-assigned {
      flex-shrink: 0;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 1px 4px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .er-cd-assigned.yes {
      color: #8ef2a8;
      background: rgba(142, 242, 168, 0.12);
    }

    .er-cd-assigned.no {
      color: var(--eng-text-faint);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Capped to ~5 rows (measured real row height 23px incl. padding +
       2px gap — see .er-script-row's own flex-shrink:0 below, needed so
       flexbox overflows into a scrollbar here instead of squeezing every
       row shorter to fit) so a long script list scrolls on its own
       instead of pushing Control Desk further down the dock; the count
       badge next to the "Scripts" title still shows the true total. */
    #er-scripts-list {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 123px;
      overflow-y: auto;
      margin-bottom: 14px;
      padding-right: 6px;
    }

    /* Takes whatever's left of the dock below the Scripts list — grows to
       fill it (flex: 1) and scrolls on its own once its content (fields,
       possibly several classes' worth with Debug on) runs past that. */
    #er-controldesk-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 6px;
    }

    /* Thin gray line, no track background, rounded — instead of the
       platform-default scrollbar (which on most setups overlays right on
       top of the text/controls near the edge rather than reserving its
       own space). Applied to every scrollable region in the Engine Room
       dock: the two independent inner scrollers above, plus the outer
       #engine-room itself (a safety-net scroll, see its own CSS) in case
       content ever exceeds even that. */
    #er-scripts-list,
    #er-controldesk-body,
    #engine-room {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.22) transparent;
    }

    #er-scripts-list::-webkit-scrollbar,
    #er-controldesk-body::-webkit-scrollbar,
    #engine-room::-webkit-scrollbar {
      width: 5px;
    }

    #er-scripts-list::-webkit-scrollbar-track,
    #er-controldesk-body::-webkit-scrollbar-track,
    #engine-room::-webkit-scrollbar-track {
      background: transparent;
    }

    #er-scripts-list::-webkit-scrollbar-thumb,
    #er-controldesk-body::-webkit-scrollbar-thumb,
    #engine-room::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.22);
      border-radius: 999px;
    }

    #er-scripts-list::-webkit-scrollbar-thumb:hover,
    #er-controldesk-body::-webkit-scrollbar-thumb:hover,
    #engine-room::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.38);
    }

    .er-script-row {
      flex-shrink: 0;
      padding: 5px 7px;
      border-radius: var(--eng-radius-sm);
      cursor: pointer;
      font-family: var(--eng-mono);
      font-size: 10.5px;
      color: var(--eng-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-left: 2px solid transparent;
      transition: background 0.1s ease;
    }

    .er-script-row:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .er-script-row.selected {
      background: var(--eng-accent-soft);
      border-left-color: var(--eng-accent);
      color: #ffd8a3;
      font-weight: 700;
    }

    .er-cd-empty {
      color: var(--eng-text-faint);
      font-style: italic;
      font-size: 10.5px;
      padding: 2px 0;
    }

    .er-cd-class {
      margin-bottom: 12px;
    }

    .er-cd-class-name {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--eng-accent);
      margin-bottom: 5px;
    }

    .er-cd-live-badge {
      font-size: 8.5px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 999px;
      text-transform: none;
      letter-spacing: 0;
    }

    .er-cd-live-badge.live {
      color: #8ef2a8;
      background: rgba(142, 242, 168, 0.12);
    }

    .er-cd-live-badge.stale {
      color: var(--eng-text-faint);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Unity-[Header]-style section divider — see Header("...") in
       scripts/dev-build-api.js's doc comment. Blue to read as a distinct
       grouping layer, separate from the class-name row's accent orange
       and the Z Order label's own light-blue (same color, deliberately —
       both are "structural divider" cues in this panel). */
    .er-cd-header {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #7dd3fc;
      margin: 10px 0 4px;
      padding-bottom: 3px;
      border-bottom: 2px solid #7dd3fc;
    }

    .er-cd-header:first-of-type {
      margin-top: 2px;
    }

    .er-cd-field {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 0;
      font-size: 10.5px;
    }

    .er-cd-field .name {
      flex: 1;
      min-width: 0;
      color: var(--eng-text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .er-cd-field .type {
      font-size: 9px;
      color: var(--eng-text-faint);
      font-family: var(--eng-mono);
    }

    .er-cd-field input[type=number] {
      width: 62px;
      flex-shrink: 0;
      background: var(--eng-panel-2);
      border: 1px solid var(--eng-border);
      color: var(--eng-text);
      border-radius: 4px;
      padding: 3px 5px;
      font-family: var(--eng-mono);
      font-size: 10.5px;
    }

    .er-cd-field input[type=number]:focus {
      outline: none;
      border-color: var(--eng-accent);
    }

    .er-cd-field input[type=checkbox] {
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      accent-color: var(--eng-accent);
      cursor: pointer;
    }

    .er-cd-field select {
      flex-shrink: 0;
      max-width: 108px;
      background: var(--eng-panel-2);
      border: 1px solid var(--eng-border);
      color: var(--eng-text);
      border-radius: 4px;
      padding: 3px 4px;
      font-size: 10px;
    }

    .er-cd-field .readonly-val {
      flex-shrink: 0;
      color: var(--eng-text-faint);
      font-family: var(--eng-mono);
      font-size: 10px;
      max-width: 108px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Device-frame simulator: switches the "screen" between the real
       window and a letterboxed 16:9 box (landscape or portrait; portrait
       is the default — see `simMode` below, since this is a mobile
       playable ad). A flush, full-width dock across the top — same
       treatment as #engine-room's dock on the right, not a floating pill —
       so it reserves its own real space instead of sitting on top of the
       game view. --dock-left/--dock-right are kept in sync with
       applyDeviceFrame()'s own stage insets (see script, TOP_BAR_HEIGHT),
       so this always spans exactly the width the game view itself is
       using — full window, inset from the Engine Room dock, or inset from
       the UI editor's panels — instead of drifting out of alignment
       whenever a dock is showing. */
    #device-topbar {
      position: fixed;
      top: 0;
      left: var(--dock-left, 0px);
      right: var(--dock-right, 280px);
      height: 44px;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: linear-gradient(180deg, var(--eng-panel-2), var(--eng-panel));
      border-bottom: 1px solid var(--eng-border);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      /* The bar itself doesn't intercept clicks — only its buttons do (see
         below). Without this, empty flex space around the buttons (and the
         label) would still capture pointer events across the bar's whole
         width, silently blocking clicks to whatever's underneath it —
         exactly what broke click-through to the UI editor's own toolbar
         (including its Layout name/Tag text inputs) when this bar used to
         span the full width over it. */
      pointer-events: none;
      transition: top 0.15s ease, left 0.15s ease, right 0.15s ease, height 0.15s ease, background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
    }

    /* While the UI editor is open, its own toolbar already fills the top
       strip underneath (see #ui-editor-frame) — this bar can't stay docked
       there without either covering it (a duplicate bar) or, transparent,
       still blocking clicks to it. It moves into a *reserved* strip above
       the editor's own Properties panel instead — not a floating overlay
       sitting on top of that panel's content, an actual dedicated space:
       tools/ui-editor.html's #properties starts 40px lower (top:93px, not
       53px) specifically to leave this exact box empty for it. Width/left
       match #properties's own 296px/right:0 exactly, so it reads as that
       panel's header strip rather than a separate floating thing. Keep
       both files' numbers in sync if either changes. */
    #device-topbar.compact {
      top: 53px;
      left: auto;
      right: 0;
      width: 296px;
      height: 40px;
      border-radius: 0;
      border-left: 1px solid var(--eng-border);
    }

    /* The label only fits comfortably in the full-width Dev-preview bar —
       the compact strip above the UI editor's Properties panel is too
       narrow for it alongside all three buttons. */
    #device-topbar.compact .label {
      display: none;
    }

    /* 3D Viewer/Editor: hidden entirely rather than just forced to "Real"
       (see setFreecamUI) — a letterboxed device-frame preview is
       meaningless while orbiting the scene with a free camera, so the bar
       itself would just be dead chrome sitting there. currentInsets()
       reclaims the top space this normally reserves while freecam is
       active, so the 3D viewport actually uses it instead of leaving a
       blank strip. */
    #device-topbar.hidden-for-3d {
      display: none;
    }

    #device-topbar .label {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--eng-text-faint);
      padding: 0 10px 0 2px;
      white-space: nowrap;
    }

    #device-topbar button {
      position: relative;
      overflow: hidden;
      /* keeps the click-ripple (see .dtb-ripple) contained to the button's own rounded box */
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      color: var(--eng-text-dim);
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--eng-radius-sm);
      padding: 6.5px 13px;
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease, transform 0.08s ease;
    }

    #device-topbar button:hover:not(.active) {
      color: var(--eng-text);
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--eng-border);
    }

    /* Tactile press feedback — a quick, soft squash on click, independent
       of the ripple below (which handles the "glow" part of the effect). */
    #device-topbar button:active {
      transform: scale(0.93);
    }

    #device-topbar button.active {
      background: linear-gradient(180deg, var(--eng-accent-hover), var(--eng-accent));
      border-color: var(--eng-accent-hover);
      color: #1a1204;
      box-shadow: 0 0 0 1px rgba(232, 150, 30, 0.35), 0 2px 10px rgba(232, 150, 30, 0.45), 0 1px 0 rgba(255, 255, 255, 0.3) inset;
    }

    /* Click ripple — a soft circle that blooms out from the click point and
       fades, spawned/removed in JS (see spawnRipple). Purely decorative
       (pointer-events: none), so it never intercepts the next click. */
    .dtb-ripple {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 70%);
      transform: scale(0);
      pointer-events: none;
      animation: dtb-ripple 0.55s cubic-bezier(0.2, 0.6, 0.4, 1) forwards;
    }

    @keyframes dtb-ripple {
      to {
        transform: scale(1);
        opacity: 0;
      }
    }

    #ui-editor-frame {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 50;
      background: transparent;
    }
  </style>
</head>

<body>

  </div>
  <div id="si-gizmo-toolbar">
    <div class="si-gizmo-modes">

      <button data-gizmo="translate" class="active" title="Move (W)">↔</button>

    </div>
