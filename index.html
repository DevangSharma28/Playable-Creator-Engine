    <button id="si-tool-frame" title="Frame selected (F)">🎯</button>
  </div>
  <div id="device-topbar">
    <span class="label">Device Preview</span>
    <button data-sim="portrait" class="active">Portrait 16:9</button>
    <button data-sim="landscape">Landscape 16:9</button>
    <button data-sim="real">Real</button>
  </div>
  <iframe id="ui-editor-frame" src="/ui-editor.html" title="UI Layout Editor" allowtransparency="true"></iframe>

  <div id="frame-stage">
    <div id="device-frame">
      <canvas id="game"></canvas>
      <div id="custom-ui-layer"></div>
      <div id="endcard-layer"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
  <script>
    // Hot reload (dev only — not present in the production build): Vite's
    // own HMR replaces esbuild's old EventSource-based bundle-swap here —
    // main.ts self-accepts its own updates (see its doc comment) so a
    // source/layout-JSON save re-executes just that module in place
    // instead of Vite's default full-page-reload fallback. A full reload
    // would wipe out the UI editor overlay's entire in-memory session
    // (undo history, unsaved edits, which project folder it's connected
    // to) every single time you hit Save, since the editor iframe is part
    // of *this* document — a real navigation tears it down and reboots it
    // from scratch along with everything else. main.ts's own
    // __disposeGame/__gameInstanceGeneration hooks (see IonEngine.ts's doc
    // comment) handle cleanly retiring the old running Game instance so
    // the two module executions never render into the canvas at the same
    // time.
    //
    // Freecam is real 3D-scene state (OrbitControls over the live
    // gameplay scene) a fresh IonEngine.boot() has no way to know was
    // already active — main.ts's own hot-accept handler reads this getter
    // to hand it back after reboot, the same handoff the old esbuild-based
    // reload made.
    window.__wasFreecamActive = () => freecamActive;

    // Edit UI: toggles the same-origin editor iframe over the running game
    // and pauses gameplay (see main.ts) while it's open, so drag gestures
    // in the editor don't fight the joystick and the 15s auto-endcard
    // timer doesn't fire mid-edit. The iframe itself is transparent and
    // stays mounted (not reloaded) across toggles, so in-progress edits
    // survive closing and reopening within the same session.
    const editorFrame = document.getElementById("ui-editor-frame");
    const engineRoom = document.getElementById("engine-room");
    const deviceTopbar = document.getElementById("device-topbar");
    document.getElementById("er-btn-editor").addEventListener("click", () => {
      editorFrame.style.display = "block";
      engineRoom.style.display = "none"; // its own top-right corner would otherwise sit under/behind the editor overlay
      deviceTopbar.classList.add("compact"); // moves into the reserved strip above the editor's Properties panel (see #device-topbar.compact's CSS) instead of colliding with its main toolbar
      window.__setUIEditorPaused && window.__setUIEditorPaused(true);
      applyDeviceFrame(); // the editor's own panels now occupy space — recompute so the frame isn't hidden behind them
    });
    window.addEventListener("message", (e) => {
      if (e.origin !== window.location.origin || e.data !== "close-ui-editor") return;
      editorFrame.style.display = "none";
      engineRoom.style.display = "";
      deviceTopbar.classList.remove("compact");
      window.__setUIEditorPaused && window.__setUIEditorPaused(false);
      applyDeviceFrame(); // editor's panels are gone — the full window is available again
    });

    // Device-frame simulator: a fixed 16:9 box — portrait (the default,
    // since this is a mobile playable ad) or landscape — or Real (fills
    // the available area, no letterbox), centered and letterboxed within
    // it. #device-frame is what the game (canvas + HUD) is actually
    // sized/positioned against, so this affects the *real* running game,
    // not a mockup; its rect is also broadcast to the editor iframe so the
    // overlay you edit against lines up with the exact same box.
    //
    // "Available area" is the full window minus whatever dev chrome is
    // currently docked and taking up real space — the Engine Room panel
    // (flush right, see #engine-room's CSS) normally, or the UI editor's
    // own toolbar/layers/properties panels while it's open (values must
    // match tools/ui-editor.html's CSS for those) — otherwise the
    // simulated screen would sit partly hidden behind them.
    const EDITOR_INSETS = { top: 53, left: 220, right: 296 };
    const ENGINE_ROOM_WIDTH = 280;
    // #device-topbar's own height (see its CSS) — also what #si-hierarchy/
    // #si-inspector/#er-exit-3d are offset below (54px = this + a 10px
    // margin, hardcoded in their CSS) so the freecam-mode chrome doesn't
    // sit under this bar either.
    const TOP_BAR_HEIGHT = 44;
    const frameStage = document.getElementById("frame-stage");
    const deviceFrame = document.getElementById("device-frame");
    const rootStyle = document.documentElement.style;
    let simMode = "portrait";
    let freecamActive = false;
    /** simMode as it was right before the 3D Viewer/Editor forced it to "real" — see setFreecamUI — so exiting hands the device-preview bar back exactly as it was left, not always reset to Portrait. */
    let preFreecamSimMode = null;

    /** Which dev chrome is currently reserving real screen space, as insets from each edge. */
    function currentInsets() {
      if (editorFrame.style.display === "block") return EDITOR_INSETS;
      // #device-topbar stays docked (reserving its own top strip) in every
      // mode except the 3D Viewer/Editor — it's hidden entirely there (see
      // setFreecamUI/#device-topbar.hidden-for-3d), so nothing needs to
      // reserve the space it would have used; the freecam viewport gets
      // the full height instead of leaving a blank strip where the bar
      // used to be.
      return { top: freecamActive ? 0 : TOP_BAR_HEIGHT, left: 0, right: freecamActive ? 0 : ENGINE_ROOM_WIDTH };
    }

    function applyDeviceFrame() {
      const insets = currentInsets();
      const stage = {
        left: insets.left,
        top: insets.top,
        width: Math.max(1, frameStage.clientWidth - insets.left - insets.right),
        height: Math.max(1, frameStage.clientHeight - insets.top),
      };
      // Keeps #device-topbar spanning exactly the *visible* stage above,
      // not the raw window, so it lines up with the game view instead of
      // drifting whenever a dock is reserving space on either side.
      rootStyle.setProperty("--dock-left", insets.left + "px");
      rootStyle.setProperty("--dock-right", insets.right + "px");

      let w = stage.width;
      let h = stage.height;
      if (simMode !== "real") {
        const ratio = simMode === "landscape" ? 16 / 9 : 9 / 16;
        if (stage.width / stage.height > ratio) {
          h = stage.height;
          w = h * ratio;
        } else {
          w = stage.width;
          h = w / ratio;
        }
      }

      // frame-stage has no offset of its own (position:fixed;inset:0), so
      // these are already viewport-relative — same coordinate space the
      // editor needs.
      const left = stage.left + (stage.width - w) / 2;
      const top = stage.top + (stage.height - h) / 2;

      deviceFrame.style.left = left + "px";
      deviceFrame.style.top = top + "px";
      deviceFrame.style.width = w + "px";
      deviceFrame.style.height = h + "px";
      window.__resizeGameTo && window.__resizeGameTo(w, h);
      broadcastDeviceFrame(left, top, w, h);
    }

    /**
     * Same as applyDeviceFrame(), but skips #device-frame's own 150ms
     * left/top/width/height transition instead of letting it animate.
     * That transition is a deliberate, nice touch for a *manual*
     * Portrait/Landscape/Real tab click — but window.__resizeGameTo above
     * always sets the renderer/camera to the *target* size immediately
     * (see Game.ts's resizeTo — it takes the target size explicitly for
     * exactly this reason, not a DOM re-measure), while the CSS box
     * itself would still be mid-animation toward that same size for the
     * next 150ms. The live WebGL frame — already rendering at the new,
     * final aspect ratio — visibly stretches/squishes to fit the
     * still-transitioning box until it catches up. setFreecamUI calls
     * this instead of applyDeviceFrame() specifically because entering/
     * exiting the 3D Viewer/Editor forces a real mode change (to/from
     * "real") as a side effect of a click that has nothing to do with
     * the device-frame tabs themselves — the animation reads as a
     * glitch there, not a flourish.
     */
    function applyDeviceFrameInstant() {
      const prevTransition = deviceFrame.style.transition;
      deviceFrame.style.transition = "none";
      void deviceFrame.offsetHeight; // commits "none" before the box actually moves below, or the browser may still animate this same change
      applyDeviceFrame();
      void deviceFrame.offsetHeight; // commits the instant jump before restoring the normal transition, so it can't retroactively animate anything
      deviceFrame.style.transition = prevTransition;
    }

    // Takes the values applyDeviceFrame just computed and assigned, rather
    // than re-measuring #device-frame via getBoundingClientRect(): that
    // measurement runs synchronously, before the CSS transition on
    // left/top/width/height has animated anywhere — it would report the
    // *previous* box, not the new target, and the editor would silently
    // keep tracking a stale rect on every mode/resize change.
    function broadcastDeviceFrame(x, y, width, height) {
      editorFrame.contentWindow.postMessage({ type: "device-frame", rect: { x, y, width, height } }, window.location.origin);
    }

    /** Blooms a soft ripple out from the click point on `btn`, purely decorative, and cleans itself up once the CSS animation finishes. */
    function spawnRipple(btn, clientX, clientY) {
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height) * 1.8;
      const ripple = document.createElement("span");
      ripple.className = "dtb-ripple";
      ripple.style.width = ripple.style.height = size + "px";
      ripple.style.left = clientX - rect.left - size / 2 + "px";
      ripple.style.top = clientY - rect.top - size / 2 + "px";
      btn.appendChild(ripple);
      ripple.addEventListener("animationend", () => ripple.remove());
    }

    document.querySelectorAll("#device-topbar button").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        simMode = btn.dataset.sim;
        document.querySelectorAll("#device-topbar button").forEach((b) => b.classList.toggle("active", b === btn));
        applyDeviceFrame();
        spawnRipple(btn, e.clientX, e.clientY);
      });
    });

    window.addEventListener("resize", applyDeviceFrame);
    applyDeviceFrame();

    // Game.create() resolves asynchronously (real GLB/texture loads) —
    // this initial applyDeviceFrame() call above always runs *before* that
    // finishes, so its __resizeGameTo call lands while `game` is still
    // undefined in main.ts and silently no-ops. main.ts calls this the
    // instant `game` is actually assigned (see its __onGameReady doc
    // comment) — first boot and every later in-place reload alike — so the
    // renderer/camera always end up sized to whatever letterbox is
    // currently active instead of defaulting to the raw window size and
    // staying that way until something else (e.g. clicking a device tab)
    // happens to call applyDeviceFrame() again.
    window.__onGameReady = applyDeviceFrame;

    // ION Engine: version + short commit hash of local HEAD, from
    // scripts/dev-build-api.js's GET /version — same dev-only API as the
    // Build button below. Fetched once on load; a stale hash until the
    // next full reload is an acceptable tradeoff for a dev panel (nothing
    // here re-polls a slow git subprocess every few seconds).
    fetch("http://127.0.0.1:8001/version")
      .then((res) => res.json())
      .then((info) => {
        const el = document.getElementById("engine-room-version");
        const commit = info.commit || "no-git";
        el.innerHTML = "v" + info.version + " · " + commit + (info.dirty ? '<span class="dirty">*</span>' : "");
        el.title = info.branch ? "Branch " + info.branch + (info.dirty ? " — uncommitted local changes" : "") : "";
      })
      .catch(() => {
        // dev-build-api isn't running (npm run dev wasn't used to start this, or it's still booting) — nothing to read version/commit from.
        const el = document.getElementById("engine-room-version");
        el.textContent = "version unavailable";
        el.title = "Build API offline — start with `npm run dev`";
      });

    // Engine Room: Builder panel. The 🛠 Builder button (top of Engine
    // Room) only *opens* this now — it used to kick off a real build the
    // instant you clicked it, with the modal purely narrating the result.
    // Building is real work (a full Vite production build, base64-inlining
    // every asset — see build.sh) that you might not want to trigger just
    // to check the current size, so opening the panel now shows the size
    // as of the *last* real build on disk (GET /estimate-size) — instant,
    // free, no build.sh run — with a freshness badge honestly flagging
    // whether anything's changed since then. The 🚀 Build Now button
    // inside is the only thing that actually runs build.sh, via POST
    // /build, same as before; its result replaces the estimate with the
    // real, just-measured number and flips the badge back to fresh.
    // Both talk to scripts/dev-build-api.js (started alongside this dev
    // server by scripts/dev.js).
    const ESTIMATE_API = "http://127.0.0.1:8001/estimate-size";
    const BUILD_API = "http://127.0.0.1:8001/build";
    const BUILD_BUDGET_BYTES = 5 * 1024 * 1024;
    const openBuilderBtn = document.getElementById("er-btn-build");
    const builderBackdrop = document.getElementById("builder-modal-backdrop");
    const builderClose = document.getElementById("builder-modal-close");
    const builderFreshness = document.getElementById("builder-freshness");
    const builderFreshnessText = document.getElementById("builder-freshness-text");
    const builderStatus = document.getElementById("builder-status");
    const builderFill = document.getElementById("builder-bar-fill");
    const builderSizeLabel = document.getElementById("builder-size-label");
    const builderDetail = document.getElementById("builder-detail");
    const builderBuildBtn = document.getElementById("builder-build-btn");
    const builderBuildBtnText = document.getElementById("builder-build-btn-text");

    /** Paints the bar/label/status from a byte count — shared by the pre-build estimate and the real post-build result, `isEstimate` only changes the bar's texture (see .estimate in the CSS) and the status wording. */
    function paintSize(sizeBytes, isEstimate) {
      const mb = sizeBytes / (1024 * 1024);
      const pct = Math.min(100, (sizeBytes / BUILD_BUDGET_BYTES) * 100);
      const over = sizeBytes > BUILD_BUDGET_BYTES;
      builderFill.classList.toggle("over-budget", over && !isEstimate);
      builderFill.classList.toggle("estimate", isEstimate);
      builderFill.style.width = pct + "%";
      builderSizeLabel.innerHTML = mb.toFixed(2) + ' MB <span class="dim">/ 5 MB budget</span>';
      if (isEstimate) {
        builderStatus.textContent = "As of last build";
        builderDetail.textContent = over ? "Was over budget last time — rebuild to confirm" : "Click Build Now for the exact current size";
      } else {
        builderStatus.textContent = over ? "Build complete — over budget" : "Build complete";
        builderDetail.textContent = over
          ? "Over the single-file budget by " + (mb - 5).toFixed(2) + " MB"
          : "Single self-contained file — dist/index.html";
      }
    }

    function setFreshness(state, text) {
      builderFreshness.classList.remove("fresh", "stale");
      if (state) builderFreshness.classList.add(state);
      builderFreshnessText.textContent = text;
    }

    /** Loads the last-known size (no build triggered) — called every time the panel opens. */
    async function refreshEstimate() {
      setFreshness(null, "Checking…");
      builderStatus.textContent = "—";
      builderFill.classList.add("estimate");
      builderFill.style.width = "0%";
      builderSizeLabel.innerHTML = "— <span class=\"dim\">/ 5 MB budget</span>";
      builderDetail.textContent = "";
      try {
        const res = await fetch(ESTIMATE_API);
        const data = await res.json();
        if (!data.exists) {
          setFreshness(null, "Never built");
          builderStatus.textContent = "No build yet";
          builderDetail.textContent = "Click Build Now to generate dist/index.html";
          return;
        }
        setFreshness(data.stale ? "stale" : "fresh", data.stale ? "Source changed since" : "Up to date");
        paintSize(data.sizeBytes, true);
      } catch (err) {
        setFreshness(null, "API offline");
        builderStatus.textContent = "Build API offline";
        builderDetail.textContent = "Is `npm run dev` still running?";
        console.error("Build API unreachable — is `npm run dev` still running?", err);
      }
    }

    function openBuilderModal() {
      builderBackdrop.classList.add("visible");
      refreshEstimate();
    }

    function closeBuilderModal() {
      builderBackdrop.classList.remove("visible");
    }

    openBuilderBtn.addEventListener("click", openBuilderModal);
    builderClose.addEventListener("click", closeBuilderModal);
    builderBackdrop.addEventListener("click", (e) => {
      if (e.target === builderBackdrop) closeBuilderModal();
    });

    builderBuildBtn.addEventListener("click", async () => {
      builderBuildBtn.disabled = true;
      builderBuildBtn.classList.remove("done", "failed");
      builderBuildBtn.classList.add("building");
      builderBuildBtnText.textContent = "Building…";
      builderStatus.textContent = "Building…";
      setFreshness(null, "Building…");
      try {
        const res = await fetch(BUILD_API, { method: "POST" });
        const data = await res.json();
        builderBuildBtn.classList.remove("building");
        if (data.ok) {
          builderBuildBtn.classList.add("done");
          builderBuildBtnText.textContent = "Built ✓";
          if (typeof data.sizeBytes === "number") {
            setFreshness("fresh", "Just built");
            paintSize(data.sizeBytes, false);
          } else {
            builderStatus.textContent = "Build complete";
            builderDetail.textContent = "(size unavailable)";
          }
        } else {
          builderBuildBtn.classList.add("failed");
          builderBuildBtnText.textContent = "Failed";
          setFreshness(null, "Build failed");
          builderStatus.textContent = "Build failed";
          builderDetail.textContent = data.error || "See console for details";
          console.error("Build failed:", data.error, "\n" + data.stderr);
        }
      } catch (err) {
        builderBuildBtn.classList.remove("building");
        builderBuildBtn.classList.add("failed");
        builderBuildBtnText.textContent = "API offline";
        setFreshness(null, "API offline");
        builderStatus.textContent = "Build API offline";
        builderDetail.textContent = "Is `npm run dev` still running?";
        console.error("Build API unreachable — is `npm run dev` still running?", err);
      }
      setTimeout(() => {
        builderBuildBtn.disabled = false;
        builderBuildBtn.classList.remove("done", "failed");
        builderBuildBtnText.textContent = "Build Now";
      }, 2200);
    });

    // Engine Room: Control Desk — a live public-field viewer/editor for the
    // running game's own gameplay classes (Player, CoinField, World, Game
    // itself; never src/game/ui/ or src/engine/ — see
    // scripts/dev-build-api.js's /list-logic-scripts). Field names/types
    // come from a static source scan (/script-info, same one the UI
    // editor's Scripts panel uses); live *values* come straight off the
    // running instance via window.__getInspectable (see IonEngine.ts) — no
    // serialization involved, this page and the running game share the
    // same document, so an edit here writes straight onto the real object.
    // Only number/boolean fields are actually editable; arrays render as a
    // view-only dropdown of their current contents; anything else (string,
    // Vector3, nested objects, ...) is shown read-only. Each field also
    // shows whether its declaration is "assigned" (has an initializer/
    // default) or "undefined" (bare declaration) — from the same
    // /script-info data, not a live-value check.
    // 🐞 Debug reveals private/protected fields too (dimmed, always
    // read-only — Debug widens visibility, never editability).
    // 💾 Save writes the live value of every currently-editable field back
    // into the script's own source (POST /save-inspectable-values below) —
    // a regex-scoped patch of just that field's declaration, not a full
    // rewrite. Saving touches a watched source file, so Vite's dev
    // watcher rebuilds and the game hot-reloads, same as any other save.
    (() => {
      const LOCAL_API_ORIGIN = "http://127.0.0.1:8001";
      const scriptsListEl = document.getElementById("er-scripts-list");
      const scriptsCountEl = document.getElementById("er-scripts-count");
      const cdBody = document.getElementById("er-controldesk-body");
      const debugBtn = document.getElementById("er-cd-debug");
      const saveBtn = document.getElementById("er-cd-save");

      let selected = null; // { path, classes: [{ name, fields }] }
      let pollTimer = null;
      let debugOn = false;
      // Bumped on every selectScript call, captured by that call's own
      // closure — if a slower-resolving fetch from an *earlier* selection
      // lands after a newer one already started (real risk: nothing
      // stopped a user from clicking two script rows in quick succession),
      // its stale response is dropped instead of clobbering `selected`
      // and `pollTimer` out from under the selection that's actually
      // showing — without this, the newer pollTimer reference gets
      // overwritten too, orphaning the newer interval running forever
      // uncleared alongside whatever the stale one just started.
      let selectionToken = 0;

      debugBtn.addEventListener("click", () => {
        debugOn = !debugOn;
        debugBtn.classList.toggle("active", debugOn);
        renderControlDesk(true); // force — bypass the focus-skip below, this is a deliberate click, not a poll tick
      });

      saveBtn.addEventListener("click", async () => {
        const edits = collectEditableFields();
        if (!edits.length || !selected) return;
        const originalText = saveBtn.textContent;
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving…";
        try {
          const res = await fetch(LOCAL_API_ORIGIN + "/save-inspectable-values", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ category: "game", path: selected.path, edits }),
          });
          const data = await res.json();
          if (data.ok) {
            saveBtn.textContent = "✅ Saved " + data.applied.length;
            if (data.failed && data.failed.length) console.warn("Control Desk: couldn't save", data.failed);
          } else {
            saveBtn.textContent = "❌ Failed";
            console.error("Control Desk save failed:", data.error);
          }
        } catch (err) {
          saveBtn.textContent = "❌ API offline";
          console.error("Control Desk: save-inspectable-values unreachable", err);
        }
        setTimeout(() => {
          saveBtn.disabled = !collectEditableFields().length;
          saveBtn.textContent = originalText;
        }, 2200);
      });

      /** Fresh at call time (never a cached render-time snapshot) so Save always picks up whatever's live right now — including a value still mid-edit in a focused input, which skips the poll-driven re-render below but has already written straight onto the instance via onFieldEdit. */
      function collectEditableFields() {
        if (!selected || typeof window.__getInspectable !== "function") return [];
        const out = [];
        selected.classes.forEach((cls) => {
          const instance = window.__getInspectable(cls.name);
          if (!instance) return;
          cls.fields.forEach((f) => {
            if (f.visibility !== "public") return;
            const value = instance[f.name];
            if (typeof value === "number" || typeof value === "boolean") {
              out.push({ className: cls.name, fieldName: f.name, kind: f.kind, value });
            }
          });
        });
        return out;
      }

      fetch(LOCAL_API_ORIGIN + "/list-logic-scripts")
        .then((res) => res.json())
        .then((data) => {
          const files = data.files || [];
          scriptsCountEl.textContent = files.length;
          if (!files.length) {
            scriptsListEl.innerHTML = '<div class="er-cd-empty">No scripts found.</div>';
            return;
          }
          scriptsListEl.innerHTML = "";
          files.forEach((relPath) => {
            const row = document.createElement("div");
            row.className = "er-script-row";
            row.textContent = relPath;
            row.title = relPath;
            row.addEventListener("click", () => selectScript(relPath, row));
            scriptsListEl.appendChild(row);
          });
        })
        .catch(() => {
          scriptsListEl.innerHTML = '<div class="er-cd-empty">Build API offline — start with `npm run dev`.</div>';
        });

      async function selectScript(relPath, rowEl) {
        const myToken = ++selectionToken;
        document.querySelectorAll(".er-script-row").forEach((r) => r.classList.toggle("selected", r === rowEl));
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
        cdBody.innerHTML = '<div class="er-cd-empty">Loading…</div>';
        try {
          const res = await fetch(LOCAL_API_ORIGIN + "/script-info?category=game&path=" + encodeURIComponent(relPath));
          const data = await res.json();
          if (myToken !== selectionToken) return; // superseded by a newer click while this fetch was in flight
          if (!data.ok) throw new Error(data.error || "script-info failed");
          selected = { path: relPath, classes: data.classes };
          renderControlDesk();
          pollTimer = setInterval(renderControlDesk, 500);
        } catch (err) {
          if (myToken !== selectionToken) return;
          cdBody.innerHTML = '<div class="er-cd-empty">Failed to load script info.</div>';
          console.error("Control Desk: script-info failed", err);
        }
      }

      function renderControlDesk(force) {
        if (!selected) return;
        // A number input the user is actively typing into would otherwise
        // get clobbered mid-edit by the next poll tick's rebuild — skip
        // this tick entirely while focus is inside the panel, resume as
        // soon as it isn't. A deliberate action (Debug toggle) forces
        // through regardless.
        if (!force && cdBody.contains(document.activeElement)) return;

        const hasHook = typeof window.__getInspectable === "function";
        // Debug off: public fields only (the original, editable surface).
        // Debug on: every field, private/protected included — those render
        // dimmed and always read-only, see renderField's isPrivate branch.
        const classesToShow = selected.classes
          .map((cls) => ({ name: cls.name, fields: cls.fields.filter((f) => debugOn || f.visibility === "public") }))
          .filter((cls) => cls.fields.length);

        if (!classesToShow.length) {
          cdBody.innerHTML = selected.classes.length
            ? '<div class="er-cd-empty">No ' + (debugOn ? "" : "public ") + "fields on " + (selected.classes.length === 1 ? "this class" : "these classes") + ".</div>"
            : '<div class="er-cd-empty">No classes found in this script.</div>';
          saveBtn.disabled = true;
          return;
        }

        let html = "";
        classesToShow.forEach((cls) => {
          const instance = hasHook ? window.__getInspectable(cls.name) : undefined;
          html += '<div class="er-cd-class"><div class="er-cd-class-name">' + cls.name;
          html += instance ? '<span class="er-cd-live-badge live">● live</span>' : '<span class="er-cd-live-badge stale">○ not running</span>';
          html += "</div>";
          // Fields already arrive in source order from /script-info, each
          // carrying whichever Header("...") text (if any) governs it —
          // just watch for that value changing as we walk the list and
          // drop in a divider row right before the first field under a
          // new one.
          let lastHeader;
          cls.fields.forEach((f) => {
            if (f.header && f.header !== lastHeader) {
              html += '<div class="er-cd-header">' + escapeHtml(f.header) + "</div>";
            }
            lastHeader = f.header;
            html += renderField(cls.name, f, instance ? instance[f.name] : undefined, !!instance);
          });
          html += "</div>";
        });
        cdBody.innerHTML = html;
        saveBtn.disabled = !collectEditableFields().length;

        cdBody.querySelectorAll("[data-field]").forEach((el) => {
          el.addEventListener(el.type === "checkbox" ? "change" : "input", onFieldEdit);
        });
      }

      function renderField(className, field, value, live) {
        const isPrivate = field.visibility !== "public";
        let control;
        if (!live) {
          control = '<span class="readonly-val">—</span>';
        } else if (!isPrivate && typeof value === "boolean") {
          control = '<input type="checkbox" data-field="' + field.name + '" data-class="' + className + '" ' + (value ? "checked" : "") + " />";
        } else if (!isPrivate && typeof value === "number") {
          control = '<input type="number" step="any" data-field="' + field.name + '" data-class="' + className + '" value="' + value + '" />';
        } else if (Array.isArray(value)) {
          const options = value.length ? value.map((item, i) => "<option>" + i + ": " + escapeHtml(summarize(item)) + "</option>").join("") : "<option>(empty)</option>";
          control = '<select disabled title="Arrays are view-only — only boolean/number fields are editable">' + options + "</select>";
        } else {
          const text = escapeHtml(summarize(value));
          control = '<span class="readonly-val" title="' + text + '">' + text + "</span>";
        }
        // Live, not static: field.assigned only reflects whether the
        // *declaration itself* has an initializer (e.g. `x: number;` has
        // none, even though the constructor always assigns a real value a
        // moment later) — a field like that would show "undefined"
        // forever even once it's genuinely live. Once an instance exists,
        // trust the actual current value instead — re-read every poll
        // tick, same as the control above, so a late assignment (async
        // load, constructor-order dependency, ...) flips the badge over
        // on its own the moment it happens rather than staying stuck at
        // whatever the source code alone could tell you.
        const assigned = live ? value !== undefined : field.assigned;
        const assignedClass = assigned ? "yes" : "no";
        const assignedLabel = assigned ? "assigned" : "undefined";
        return (
          '<div class="er-cd-field' + (isPrivate ? " private" : "") + '"><span class="name" title="' + field.name + " : " + (field.type || "") + '">' + field.name + "</span>" +
          '<span class="er-cd-assigned ' + assignedClass + '">' + assignedLabel + "</span>" +
          control +
          "</div>"
        );
      }

      function summarize(value) {
        if (value === undefined) return "undefined";
        if (value === null) return "null";
        if (typeof value === "object") {
          if (typeof value.x === "number" && typeof value.y === "number" && typeof value.z === "number") {
            return "(" + value.x.toFixed(2) + ", " + value.y.toFixed(2) + ", " + value.z.toFixed(2) + ")";
          }
          return (value.constructor && value.constructor.name) || "object";
        }
        return String(value);
      }

      function escapeHtml(s) {
        return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      }

      function onFieldEdit(e) {
        const el = e.target;
        const instance = typeof window.__getInspectable === "function" ? window.__getInspectable(el.dataset.class) : undefined;
        if (!instance) return;
        if (el.type === "checkbox") {
          instance[el.dataset.field] = el.checked;
        } else {
          const num = parseFloat(el.value);
          if (!Number.isNaN(num)) instance[el.dataset.field] = num;
        }
      }
    })();

    // Engine Room: 3D Viewer/Editor — toggles freecam (OrbitControls) over
    // the live gameplay scene via main.ts's __setFreecamActive hook, which
    // also pauses update() so the player/camera don't fight the orbit
    // drag. While active: #engine-room hides entirely (its own
    // #er-btn-viewer is unreachable then anyway) and is replaced by just
    // #er-exit-3d; the device-preview bar hides too (a letterboxed
    // Portrait/Landscape frame is meaningless for a free camera) and its
    // mode is forced to "Real" for the duration, restored on exit; and the
    // scene hierarchy (left) / inspector (right) panels light up — see
    // setFreecamUI below for all of it. The UI editor can't be open when
    // this fires — #er-btn-viewer lives inside #engine-room, which the
    // editor-open handler above already hides.
    const viewerBtn = document.getElementById("er-btn-viewer");
    const exitViewerBtn = document.getElementById("er-exit-3d");
    const hierarchyPanel = document.getElementById("si-hierarchy");
    const inspectorPanel = document.getElementById("si-inspector");
    const gizmoToolbar = document.getElementById("si-gizmo-toolbar");

    function setFreecamUI(on) {
      freecamActive = on;
      engineRoom.style.display = on ? "none" : "";
      exitViewerBtn.classList.toggle("visible", on);
      hierarchyPanel.classList.toggle("visible", on);
      inspectorPanel.classList.toggle("visible", on);
      gizmoToolbar.classList.toggle("visible", on);
      deviceTopbar.classList.toggle("hidden-for-3d", on);
      // The 3D Viewer/Editor always orbits the full window — a letterboxed
      // Portrait/Landscape preview means nothing for a free camera — so
      // force "Real" on entry, remembering whatever mode was actually
      // active so exiting hands it back exactly as you left it.
      if (on) {
        preFreecamSimMode = simMode;
        simMode = "real";
        document.querySelectorAll("#device-topbar button").forEach((b) => b.classList.toggle("active", b.dataset.sim === "real"));
      } else if (preFreecamSimMode) {
        simMode = preFreecamSimMode;
        document.querySelectorAll("#device-topbar button").forEach((b) => b.classList.toggle("active", b.dataset.sim === simMode));
        preFreecamSimMode = null;
      }
      window.__setFreecamActive && window.__setFreecamActive(on);
      applyDeviceFrameInstant(); // Engine Room/device-topbar just showed/hid, and simMode may have just changed — the game view's available width and shape changed with it. Instant, not animated — see its own doc comment for why this specific jump can't use the normal transition.
    }

    viewerBtn.addEventListener("click", () => setFreecamUI(true));
    exitViewerBtn.addEventListener("click", () => setFreecamUI(false));

    // Engine Room: Audio Reactor — placeholder panel, no audio system wired
    // up yet. Independent of freecam (unlike the hierarchy/inspector panels
    // above), so it opens/closes purely off its own button regardless of
    // 3D View state.
    const audioBtn = document.getElementById("er-btn-audio");
    const audioPanel = document.getElementById("audio-reactor");
    audioBtn.addEventListener("click", () => {
      audioPanel.classList.toggle("visible");
    });

    // Gizmo mode (Select/Move/Rotate/Scale) — a thin passthrough to
    // SceneInspector via main.ts's __setGizmoMode hook (only meaningful
    // while freecam/3D View is active, same as the panels above). Also
    // listens for __onGizmoModeChanged so the W/E/R/Q keyboard shortcuts
    // (handled inside SceneInspector, not here) keep these buttons' active
    // state in sync instead of only ever reacting to being clicked directly.
    document.querySelectorAll(".si-gizmo-modes button").forEach((btn) => {
      btn.addEventListener("click", () => {
        window.__setGizmoMode && window.__setGizmoMode(btn.dataset.gizmo);
        document.querySelectorAll(".si-gizmo-modes button").forEach((b) => b.classList.toggle("active", b === btn));
      });
    });
    window.__onGizmoModeChanged = (mode) => {
      document.querySelectorAll(".si-gizmo-modes button").forEach((b) => b.classList.toggle("active", b.dataset.gizmo === mode));
    };

    // Grid / Helpers / Snap / Space / Frame — same passthrough shape as the
    // gizmo-mode buttons above, via IonEngine's __toggleGrid/__toggleHelpers/
    // __toggleSnap/__toggleSpace/__frameSelected hooks. The four toggles
    // paint their own active state off the return value immediately;
    // __onInspectorStateChanged (registered once, below) is what keeps them
    // in sync when the same toggles fire from SceneInspector's F/G/H/X/C
    // keyboard shortcuts instead of a click here.
    const toolGridBtn = document.getElementById("si-tool-grid");
    const toolHelpersBtn = document.getElementById("si-tool-helpers");
    const toolSnapBtn = document.getElementById("si-tool-snap");
    const toolSpaceBtn = document.getElementById("si-tool-space");
    const toolFrameBtn = document.getElementById("si-tool-frame");

    toolGridBtn.addEventListener("click", () => {
      const on = window.__toggleGrid && window.__toggleGrid();
      toolGridBtn.classList.toggle("active", !!on);
    });
    toolHelpersBtn.addEventListener("click", () => {
      const on = window.__toggleHelpers && window.__toggleHelpers();
      toolHelpersBtn.classList.toggle("active", !!on);
    });
    toolSnapBtn.addEventListener("click", () => {
      const on = window.__toggleSnap && window.__toggleSnap();
      toolSnapBtn.classList.toggle("active", !!on);
    });
    toolSpaceBtn.addEventListener("click", () => {
      const space = window.__toggleSpace && window.__toggleSpace();
      toolSpaceBtn.classList.toggle("active", space === "local");
      toolSpaceBtn.title = "Toggle local/world space (C) — currently " + (space || "world");
    });
    toolFrameBtn.addEventListener("click", () => {
      window.__frameSelected && window.__frameSelected();
    });

    window.__onInspectorStateChanged = (state) => {
      toolGridBtn.classList.toggle("active", state.grid);
      toolHelpersBtn.classList.toggle("active", state.helpers);
      toolSnapBtn.classList.toggle("active", state.snap);
      toolSpaceBtn.classList.toggle("active", state.space === "local");
      toolSpaceBtn.title = "Toggle local/world space (C) — currently " + state.space;
    };

    // Engine Room: live FPS/draw calls/triangles, fed by main.ts's
    // __getEngineStats hook. Polled rather than updated every rAF frame —
    // a stats readout doesn't need 60Hz DOM writes. FPS is color-coded
    // (green/amber/red) the way engine profilers flag frame-budget health
    // at a glance, rather than making you read the number every time.
    const fpsEl = document.getElementById("er-fps");
    setInterval(() => {
      if (!window.__getEngineStats) return;
      const stats = window.__getEngineStats();
      fpsEl.textContent = stats.fps;
      fpsEl.classList.toggle("warn", stats.fps < 50 && stats.fps >= 30);
      fpsEl.classList.toggle("bad", stats.fps < 30);
      document.getElementById("er-drawcalls").textContent = stats.drawCalls;
      document.getElementById("er-triangles").textContent = stats.triangles;
    }, 400);
  </script>
</body>

</html>
