# Runs the verification suite and a real production build on every push and
# pull request.
#
# This exists because the repo's guarantees were, until now, only as good as
# someone remembering to type `npm test` — and the geometry-parity suite (the
# mechanical enforcement the locked UI-scaling system depends on) sat red
# across several commits precisely because nobody did. Having a test and
# running a test are different things.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes an in-flight run. PRs get this per
# head ref, so force-pushing a fix doesn't leave the old run burning minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node the project is developed against. The suites use
          # node:test and top-level await, so 18 is the real floor; pinning 22
          # keeps CI and local behaviour identical rather than merely compatible.
          node-version: 22
          cache: npm

      # ci, not install: fails loudly if package-lock.json and package.json
      # have drifted, rather than quietly resolving a different tree than the
      # one anyone tested against.
      - run: npm ci

      # tests/project-generator.test.mjs runs create-ion-project.mjs against
      # packages/*/dist — gitignored, not part of the checkout — so without
      # this the generator suite fails on every run with "the ION packages
      # ... haven't been built", not because of anything the change under
      # test did.
      - run: node scripts/build-packages.mjs

      # typecheck + the whole node:test suite: runtime lifecycle, the simple
      # API, serialization round-trips, undo/redo, the project generator, the
      # dev API, the compatibility gate, particles, shaders, geometry parity,
      # scene environment, UI layout/editor, render-defaults parity, and the
      # editor smoke pass. No browser needed: every suite runs over jsdom plus
      # the stub WebGL context in tests/lib/dom-env.mjs (see ENGINE.md §13).
      - run: npm test

      # Separate step so a performance regression is reported as a performance
      # regression rather than as "the tests failed". --expose-gc is what makes
      # the heap-growth baselines mean anything; without it they measure
      # whatever V8 happened to collect.
      - name: Performance baselines
        run: npm run test:perf

      # A real browser: edit a 3D object, Save, Exit, then reload the page and
      # assert the object is still where the editor left it. The in-process
      # suites prove the serializer and the loader agree; only an actual reload
      # proves the thing that was broken.
      - name: 3D editor persistence across a browser reload
        run: npm run verify:persistence

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deliberately NOT `needs: test`. The two answer different questions and a
    # broken build is worth knowing about in the same run as a failing test,
    # not one round trip later.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # build.sh needs python3 (present on ubuntu-latest) and zip (present).
      # ffmpeg is NOT installed on the runner and is deliberately not added:
      # scripts/compress-assets.mjs degrades to using the original .ogg files
      # and warns, so CI still exercises the real pipeline. It means audio is
      # uncompressed in CI's output, so treat the size numbers below as an
      # upper bound rather than the figure a local build produces.
      # build.sh gates itself: its final step is
      # scripts/check-build-report.mjs, which exits 2 on a non-empty
      # compatibilityWarnings or an over-budget artifact. So this step failing
      # already means "built, but not submittable" — nothing extra is needed
      # here to enforce it.
      - name: Build
        run: npm run build

      # Purely to emit the job summary. The gate has already run inside
      # build.sh above, so this adds no enforcement — it re-reads the same
      # report to write the size/compatibility table onto the run, and does so
      # even when the build failed, which is exactly when those numbers are
      # worth having. continue-on-error keeps it from reporting the same
      # failure a second time.
      - name: Build report summary
        if: always()
        continue-on-error: true
        run: node scripts/check-build-report.mjs

      # The whole client workflow, from an empty directory: generate a project,
      # npm install it, build it, and run the result in headless Chrome. This
      # is the only step that exercises the packages the way a customer does —
      # everything above tests the repository, which is not the same artifact.
      - name: End-to-end client workflow
        run: |
          node scripts/build-packages.mjs
          npm run test:e2e

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playable-${{ github.sha }}
          path: |
            dist/index.html
            dist/build-report.json
            dist/index.zip
          if-no-files-found: error
          retention-days: 14
